[package]
name = "uwunsafe"
version = "0.1.0"
edition = "2024"
authors = ["c1ph3rC4t"]
categories = []
description = "UwUnsafe makes your code unsafe the uwu proc macro."
homepage = "https://github.com/c1ph3rC4t/uwunsafe"
keywords = ["uwu", "anime", "meme", "unsafe", "convenience"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/c1ph3rC4t/uwunsafe"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
